<div class="phone">
  <div class="body">
    <div class="policy-illust">
      <svg viewBox="0 0 96 80" width="96" height="80" xmlns="http://www.w3.org/2000/svg">
        <!-- document stack -->
        <rect x="6" y="6" width="40" height="50" rx="3" fill="#fff" stroke="#0a0a0a" stroke-width="1.4"/>
        <line x1="12" y1="18" x2="40" y2="18" stroke="#0a0a0a" stroke-width="1"/>
        <line x1="12" y1="24" x2="40" y2="24" stroke="#0a0a0a" stroke-width="1"/>
        <line x1="12" y1="30" x2="32" y2="30" stroke="#0a0a0a" stroke-width="1"/>
        <line x1="12" y1="38" x2="40" y2="38" stroke="#0a0a0a" stroke-width="1"/>
        <line x1="12" y1="44" x2="36" y2="44" stroke="#0a0a0a" stroke-width="1"/>

        <path d="M40 64 L46 52 Q49 48 54 48 L82 48 Q87 48 90 52 L96 64 L96 72 Q96 74 94 74 L42 74 Q40 74 40 72 Z" fill="#fff" stroke="#0a0a0a" stroke-width="1.4"/>

        <circle cx="54" cy="74" r="6" fill="#0a0a0a"/>
        <circle cx="54" cy="74" r="2.5" fill="#fff"/>
        <circle cx="84" cy="74" r="6" fill="#0a0a0a"/>
        <circle cx="84" cy="74" r="2.5" fill="#fff"/>
      </svg>
      <h2>Select your policy</h2>
      <div class="headline-divider"></div>
      <p>We found multiple policies linked to your mobile number. Please select the claim vehicle's policy</p>
    </div>

    <div class="policy-list">
      <a href="dashboard.html?policy=verna" class="policy-card">
        <div class="top">
          <div class="name">Hyundai Verna Lxi</div>
          <div class="reg">MH 44 H 5475</div>
        </div>
        <div class="meta">
          <div class="meta-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l9 4v6c0 5.5-3.8 10.7-9 12-5.2-1.3-9-6.5-9-12V5l9-4z"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            Zoop.one
          </div>
          <div class="meta-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            Ramesh Gupta
          </div>
        </div>
      </a>

      <a href="dashboard.html?policy=swift" class="policy-card">
        <div class="top">
          <div class="name">Maruti Swift Vxi</div>
          <div class="reg">MH 32 H 4389</div>
        </div>
        <div class="meta">
          <div class="meta-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l9 4v6c0 5.5-3.8 10.7-9 12-5.2-1.3-9-6.5-9-12V5l9-4z"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            Zoop.one

          <div class="meta-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            Ramesh Gupta
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
