<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Quagga Tech · Claims · Welcome</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone">
  <div class="body">
    <div class="welcome-illust">
      <svg viewBox="0 0 320 180" width="320" height="180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#e5e5e5"/>
          </linearGradient>
        </defs>
        <!-- car body -->
        <path d="M30 110 L60 70 Q70 56 92 54 L210 54 Q232 54 248 72 L286 110 L286 130 Q286 138 278 138 L42 138 Q30 138 30 130 Z" fill="url(#g)" stroke="#0a0a0a" stroke-width="1.2"/>
        <!-- windows -->
        <path d="M82 76 L102 60 L160 60 L160 90 L80 90 Z" fill="#1a1a1a" opacity="0.9"/>
        <path d="M168 60 L210 60 Q224 60 232 70 L240 90 L168 90 Z" fill="#1a1a1a" opacity="0.9"/>
        <line x1="160" y1="60" x2="160" y2="90" stroke="#fff" stroke-width="1"/>
        <!-- door line -->
        <path d="M120 90 L120 138" stroke="#999" stroke-width="0.8"/>
        <!-- handle -->
        <rect x="124" y="105" width="22" height="3" rx="1.5" fill="#999"/>
        <!-- headlight -->
        <ellipse cx="276" cy="100" rx="8" ry="4" fill="#fff8b8"/>
        <!-- wheels -->
        <circle cx="92" cy="138" r="22" fill="#0a0a0a"/>
        <circle cx="92" cy="138" r="10" fill="#666"/>
        <circle cx="92" cy="138" r="4" fill="#222"/>
        <circle cx="240" cy="138" r="22" fill="#0a0a0a"/>
        <circle cx="240" cy="138" r="10" fill="#666"/>
        <circle cx="240" cy="138" r="4" fill="#222"/>
      </svg>
      <div class="sparkle s1">✦</div>
      <div class="sparkle s2">✧</div>
    </div>

    <h1 class="welcome-title">Your Claim, Our Care</h1>

    <div class="checklist">
      <div class="checklist-item active">
        <div class="num">1</div>
        <div class="label">Share Vehicle Details</div>
      </div>
      <div class="checklist-item pending">
        <div class="num">2</div>
        <div class="label">Share Accident Details</div>
      </div>
      <div class="checklist-item pending">
        <div class="num">3</div>
        <div class="label">Get your Claim Journey Started!</div>
      </div>
    </div>

    <div class="tcs-banner">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.6" fill="currentColor"/></svg>
      Please make sure all the information provided is accurate.
    </div>
  </div>
</div>

<script src="_partials.js"></script>
<script>
  injectChrome({ brand: 'Zoop.one', sub: 'Claims Registration Form', back: 'javascript:history.back()' });
  injectFooter(`
    <div class="tcs-text">By proceeding, you are agreeing to<br/>Zoop's <a href="#">Privacy Policy</a> and <a href="#">Terms &amp; Conditions</a></div>
    <a href="mobile.html" class="btn btn-primary">Start</a>
  `);
</script>
</body>
</html>
