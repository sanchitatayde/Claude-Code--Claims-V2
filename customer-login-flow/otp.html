<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Quagga Tech · Verify OTP</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone">
  <div class="body" id="dim">
    <div class="green-header">
      <h1 class="headline">Verify &amp; Proceed to <span class="accent">Vehicle Records</span></h1>
      <div class="headline-divider"></div>
      <p class="subhead">Enter your vehicle details required proceed with your Claim Details :</p>
    </div>
    <div style="padding: 16px 24px 0;">
      <div class="phone-input">
        <div class="country"><span class="flag">🇮🇳</span><span class="chev">▾</span></div>
        <input value="98765 43210" disabled style="color:#111" />
      </div>
      <div style="height: 16px"></div>
      <a href="javascript:void(0)" class="alt-action" id="reopenOtp" onclick="openSheet()">
        <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 11h2M11 11h2M15 11h2"/></svg></div>
        <div class="lbl">Enter OTP</div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 6 15 12 9 18"/></svg>
      </a>
    </div>
  </div>

  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="bottomsheet" id="sheet">
    <div class="illust">
      <svg viewBox="0 0 80 80" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
        <!-- hand -->
        <path d="M14 78 Q14 50 22 48 L46 48 Q56 48 56 56 L56 78 Z" fill="#fdd9b8" stroke="#0a0a0a" stroke-width="1.2"/>
        <!-- phone -->
        <rect x="22" y="14" width="32" height="46" rx="5" fill="#fff" stroke="#0a0a0a" stroke-width="1.4"/>
        <rect x="25" y="20" width="26" height="32" rx="2" fill="#f3f4f6"/>
        <!-- check circle -->
        <circle cx="38" cy="32" r="11" fill="#00c266"/>
        <path d="M33 32 l4 4 l7-7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- otp dots -->
        <rect x="28" y="46" width="4" height="2" rx="1" fill="#9ca3af"/>
        <rect x="34" y="46" width="4" height="2" rx="1" fill="#9ca3af"/>
        <rect x="40" y="46" width="4" height="2" rx="1" fill="#9ca3af"/>
        <rect x="46" y="46" width="4" height="2" rx="1" fill="#9ca3af"/>
      </svg>
    </div>
    <h2>Verify OTP</h2>
    <div class="headline-divider"></div>
    <p>Enter the 6-digit OTP sent to your registered mobile number (XX19) &amp; email id (k*****@gmail.com). The code is valid for 10 minutes.</p>
    <div class="otp-row">
      <input maxlength="1" inputmode="numeric" autofocus oninput="onOtp(this,0)" />
      <input maxlength="1" inputmode="numeric" oninput="onOtp(this,1)" />
      <input maxlength="1" inputmode="numeric" oninput="onOtp(this,2)" />
      <input maxlength="1" inputmode="numeric" oninput="onOtp(this,3)" />
      <input maxlength="1" inputmode="numeric" oninput="onOtp(this,4)" />
      <input maxlength="1" inputmode="numeric" oninput="onOtp(this,5)" />
    </div>
    <div class="resend">Resend in <strong id="timer">01:30</strong></div>
    <a id="verify" href="javascript:void(0)" class="btn btn-disabled">Verify</a>
  </div>
</div>

<script src="_partials.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const via = params.get('via');
  const backHref = via === 'rc' ? 'rc.html' : 'mobile.html';
  const verifyDest = 'dashboard.html';
  injectChrome({ brand: 'Zoop.one', sub: 'Claims Registration Form', back: backHref });

  const sheet = document.getElementById('sheet');
  const scrim = document.getElementById('scrim');
  function closeSheet() {
    sheet.style.display = 'none';
    scrim.style.display = 'none';
  }
  function openSheet() {
    sheet.style.display = '';
    scrim.style.display = '';
    const firstEmpty = Array.from(inputs).find(x => !x.value) || inputs[0];
    firstEmpty.focus();
  }

  const inputs = document.querySelectorAll('.otp-row input');
  function onOtp(el, i) {
    el.value = el.value.replace(/[^0-9]/g, '');
    if (el.value && i < inputs.length - 1) inputs[i+1].focus();
    const filled = Array.from(inputs).every(x => x.value.length === 1);
    const v = document.getElementById('verify');
    if (filled) {
      v.classList.remove('btn-disabled');
      v.classList.add('btn-primary');
      v.setAttribute('href', verifyDest);
    } else {
      v.classList.add('btn-disabled');
      v.classList.remove('btn-primary');
      v.setAttribute('href', 'javascript:void(0)');
    }
  }
  inputs.forEach((el, i) => el.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !el.value && i > 0) inputs[i-1].focus();
  }));

  // countdown
  let secs = 90;
  const t = document.getElementById('timer');
  const iv = setInterval(() => {
    secs--;
    if (secs <= 0) { t.textContent = 'now'; clearInterval(iv); return; }
    const m = String(Math.floor(secs/60)).padStart(2,'0');
    const s = String(secs%60).padStart(2,'0');
    t.textContent = `${m}:${s}`;
  }, 1000);
</script>
</body>
</html>
